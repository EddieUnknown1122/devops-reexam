apiVersion: v1
kind: Pod
metadata:
  name: k6-load-test
  namespace: crud-app
  labels:
    app: k6
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:latest
      command: ["sh", "-c"]
      args:
        - k6 run /scripts/load-test.js; echo "k6 finished"; sleep 900
      env:
        - name: BASE_URL
          value: http://crud-app:8080
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: /results/k6-report.html
      volumeMounts:
        - name: script
          mountPath: /scripts
        - name: results
          mountPath: /results
  volumes:
    - name: script
      configMap:
        name: k6-script
    - name: results
      emptyDir: {}